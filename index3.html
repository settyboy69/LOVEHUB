<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Greeting</title>
    <link rel="icon" type="image/png" href="LOVE_HUB.jpg">
    <link rel="apple-touch-icon" href="LOVE_HUB.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #8b0000 0%, #a52a2a 50%, #b22222 100%);
            background-size: 200% 200%;
            animation: gradientShift 20s ease infinite;
            z-index: -1;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1500px;
            transition: opacity 0.8s ease;
        }

        .card-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .greeting-card {
            width: 90%;
            max-width: 450px;
            min-width: 280px;
            background: #ffffff;
            border-radius: 2px;
            padding: 70px 50px;
            box-shadow: 0 2px 40px rgba(220, 38, 38, 0.08);
            text-align: center;
            transform-style: preserve-3d;
            transition: transform 1.2s ease-in-out;
            animation: floatingCard 3s ease-in-out infinite;
            border: 1px solid rgba(220, 38, 38, 0.1);
            backface-visibility: hidden;
        }

        @keyframes floatingCard {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .greeting-card.flip {
            animation: zoomAndFlip 1.2s ease-in-out forwards;
        }

        @keyframes zoomAndFlip {
            0% { transform: translateY(0) scale(1); }
            40% { transform: translateY(0) scale(1.15); }
            100% { transform: rotateY(180deg) scale(0.8); }
        }

        .card-title {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 300;
            color: #dc2626;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .card-message {
            font-size: clamp(15px, 2vw, 17px);
            color: #6b7280;
            margin-bottom: 50px;
            line-height: 1.8;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .open-button {
            background: transparent;
            color: #dc2626;
            border: 1px solid #dc2626;
            padding: clamp(12px, 1.5vw, 16px) clamp(30px, 5vw, 50px);
            font-size: clamp(12px, 1.5vw, 14px);
            font-weight: 400;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Georgia', serif;
        }

        .open-button:hover {
            background: #dc2626;
            color: #ffffff;
        }

        .open-button:active {
            transform: scale(0.98);
        }

        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: none;
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #8b0000 0%, #a52a2a 50%, #b22222 100%);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            opacity: 0;
            transform: scale(0.3);
            transition: opacity 1s ease, transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .video-container.show {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        .video-container video {
            width: 90%;
            max-width: 1080px;
            height: auto;
            object-fit: contain;
            animation: videoZoomIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            border: 3px solid #ffffff;
            box-shadow: 0 0 0 1px #dc2626, 
                        0 0 0 6px #ffffff,
                        0 10px 40px rgba(0, 0, 0, 0.4);
            border-radius: 2px;
        }

        @keyframes videoZoomIn {
            0% { transform: scale(0.5); opacity: 0; }
            50% { opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        #sharePopup {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #ffffff;
            color: #374151;
            padding: 16px 24px;
            border-radius: 0;
            border: 1px solid #e5e7eb;
            font-weight: 400;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 300;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        #sharePopup.show {
            opacity: 1;
            transform: translateY(0);
        }

        #sharePopup button {
            background: transparent;
            color: #dc2626;
            border: 1px solid #dc2626;
            padding: 8px 16px;
            border-radius: 0;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #sharePopup button:hover {
            background: #dc2626;
            color: #ffffff;
        }

        @media (max-width: 1024px) {
            .greeting-card { padding: 60px 40px; }
        }

        @media (max-width: 768px) {
            .greeting-card { padding: 50px 30px; }
            .card-title { letter-spacing: 0.5px; }
            .card-message { font-size: 15px; }
        }

        @media (max-width: 480px) {
            .greeting-card { padding: 40px 20px; }
            .card-title { font-size: 26px; }
            .card-message { font-size: 14px; }
            .open-button { padding: 10px 25px; font-size: 12px; }
            #sharePopup { right: 15px; bottom: 15px; padding: 12px 16px; }
        }
    </style>
</head>

<body>
    <div class="background"></div>

    <div class="card-container" id="cardContainer">
        <div class="greeting-card" id="greetingCard">
            <h1 class="card-title">Happy Valentine's Day</h1>
            <p class="card-message">You're a truly wonderful friend.<br>Click below for a little extra love today.</p>
            <button class="open-button" id="openButton">Open Your Surprise</button>
        </div>
    </div>

    <canvas id="confettiCanvas"></canvas>

    <div class="video-container" id="videoContainer">
        <video id="surpriseVideo" controls>
            <source src="surprise.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <audio id="openSound" preload="auto">
        <source src="open.mp3" type="audio/mpeg">
    </audio>

    <div id="sharePopup">
        Share this link with your friends to prank them
        <button id="copyLinkButton">Copy Link</button>
    </div>

    <script>
        class ConfettiPiece {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.reset();
            }
            reset() {
                this.x = Math.random() * this.canvas.width;
                this.y = -20;
                this.size = Math.random() * 8 + 5;
                this.speedY = Math.random() * 3 + 2;
                this.speedX = Math.random() * 2 - 1;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 10 - 5;
                const colors = ['#dc2626', '#ef4444', '#f87171', '#fca5a5', '#fecaca', '#ffffff', '#ffe4e6', '#fda4af'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotationSpeed;
                if (this.y > this.canvas.height) this.reset();
            }
            draw() {
                this.ctx.save();
                this.ctx.translate(this.x, this.y);
                this.ctx.rotate(this.rotation * Math.PI / 180);
                this.ctx.fillStyle = this.color;
                this.ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                this.ctx.restore();
            }
        }

        const openButton = document.getElementById('openButton');
        const greetingCard = document.getElementById('greetingCard');
        const cardContainer = document.getElementById('cardContainer');
        const confettiCanvas = document.getElementById('confettiCanvas');
        const videoContainer = document.getElementById('videoContainer');
        const surpriseVideo = document.getElementById('surpriseVideo');
        const openSound = document.getElementById('openSound');
        const sharePopup = document.getElementById('sharePopup');
        const copyButton = document.getElementById('copyLinkButton');

        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
        const ctx = confettiCanvas.getContext('2d');
        const confettiPieces = [];
        const confettiCount = 150;
        for (let i = 0; i < confettiCount; i++) { confettiPieces.push(new ConfettiPiece(confettiCanvas)); }
        let confettiActive = false; let confettiTimer = null;

        function animateConfetti() {
            if (!confettiActive) return;
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            confettiPieces.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateConfetti);
        }

        function startConfetti() {
            confettiCanvas.style.display = 'block';
            confettiActive = true;
            animateConfetti();
            confettiTimer = setTimeout(() => { stopConfetti(); }, 4000);
        }

        function stopConfetti() {
            confettiActive = false;
            confettiCanvas.style.display = 'none';
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        }

        openButton.addEventListener('click', () => {
            openButton.disabled = true; openButton.style.cursor = 'not-allowed';
            openSound.play().catch(e => console.log('Audio playback failed', e));
            greetingCard.classList.add('flip');
            setTimeout(() => { startConfetti(); }, 300);
            setTimeout(() => { cardContainer.classList.add('hidden'); }, 1500);
            setTimeout(() => {
                videoContainer.classList.add('show');
                surpriseVideo.play().catch(e => console.log('Video autoplay failed', e));
            }, 2300);
        });

        let popupShown = false;
        surpriseVideo.addEventListener('timeupdate', () => {
            if (surpriseVideo.currentTime >= 5 && !popupShown) {
                sharePopup.classList.add('show');
                popupShown = true;
            }
        });

        copyButton.addEventListener('click', () => {
            const link = window.location.href;
            navigator.clipboard.writeText(link).then(() => {
                sharePopup.style.background = '#dc2626';
                sharePopup.style.color = '#ffffff';
                sharePopup.style.borderColor = '#dc2626';
                sharePopup.textContent = 'Thank you! Have fun!';
                setTimeout(() => { sharePopup.classList.remove('show'); }, 2000);
            }).catch(() => { alert('Copy failed'); });
        });

        window.addEventListener('resize', () => {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        });

        window.addEventListener('beforeunload', () => {
            if (confettiTimer) clearTimeout(confettiTimer);
            stopConfetti();
        });
    </script>
</body>

</html>
